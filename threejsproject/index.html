<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Data Visualization Timeline</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <div class="panel">
            <h3>개발자 설정 (Load Files)</h3>
            <div class="input-group">
                <label>GLB 모델:</label>
                <input type="file" id="file-model" accept=".glb,.gltf">
            </div>
            <div class="input-group">
                <label>데이터 (JSON/CSV):</label>
                <input type="file" id="file-data" accept=".json,.csv">
            </div>
            <div class="input-group">
                <button id="btn-toggle-visibility">오브젝트 Show/Hide</button>
            </div>
        </div>

        <div class="panel timeline-panel">
            <div class="controls">
                <button id="btn-play">▶ 재생</button>
                <button id="btn-pause">⏸ 일시정지</button>
                <select id="select-speed">
                    <option value="0.5">0.5x 배속</option>
                    <option value="1" selected>1.0x 배속</option>
                    <option value="2">2.0x 배속</option>
                    <option value="5">5.0x 배속</option>
                </select>
                <span id="time-display">Time: 0.00</span>
            </div>
            <input type="range" id="timeline-slider" min="0" max="100" step="0.1" value="0">
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
