<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 하루동안 보지 않기</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }

        #start-screen {
            position: absolute;
            z-index: 10;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 90vw;
            height: 90vh;
            max-width: 1000px;
            max-height: 1000px;
        }

        .grid-cell {
            position: relative;
            cursor: pointer; /* 누를 수 있다는 걸 마우스 모양으로 보여준데이 */
        }

        .circle {
            width: 8px;
            height: 8px;
            background-color: #ff6442;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <label class="checkbox-label">
            <input type="checkbox" id="hide-today-checkbox">
            오늘 하루동안 보지 않기
        </label>
    </div>
    
    <div id="grid-container">
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
    </div>

    <script>
        const AUDIO_FILES = [
            './notisounds/instagram02.wav', 
            './notisounds/galaxy02.wav', 
            './notisounds/kakaotalk.wav', 
            './notisounds/galaxy01.mp3', 
            './notisounds/iphone2.mp3', 
            './notisounds/iphone01.wav', 
            './notisounds/discord.mp3', 
            './notisounds/instagram01.wav', 
            './notisounds/facebook.mp3'  
        ];

        let audioCtx;
        let audioArrayBuffers = new Array(9).fill(null);
        let audioBuffers = new Array(9).fill(null);
        
        let isRunning = false;
        
        // 9개 원이 각자 자기 소리를 따로 담아둘 수 있게 배열을 9개로 쪼갰데이
        let activeSources = Array.from({length: 9}, () => []); 
        
        let activeIndices = [4]; 

        let circleStates = Array.from({length: 9}, () => ({ size: 8, level: 1 }));
        
        let timers = new Array(9).fill(null);

        const circles = document.querySelectorAll('.circle');
        const cells = document.querySelectorAll('.grid-cell');
        const startScreen = document.getElementById('start-screen');

        AUDIO_FILES.forEach((path, i) => {
            fetch(path)
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    audioArrayBuffers[i] = buffer;
                    if (audioCtx && !audioBuffers[i]) {
                        audioCtx.decodeAudioData(buffer.slice(0), (decoded) => {
                            audioBuffers[i] = decoded;
                        });
                    }
                })
                .catch(err => {
                    console.log(i + "번째 파일 경로 확인해 봐라.");
                });
        });

        function playSound(index, currentLevel) {
            if (!audioCtx) return;
            const buffer = audioBuffers[index];
            if (!buffer) return;

            for (let i = 0; i < currentLevel; i++) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;

                const gainNode = audioCtx.createGain();
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                source.start(0);
                
                // 해당 원의 전용 소리통에만 집어넣는 기다
                activeSources[index].push(source);

                source.onended = () => {
                    activeSources[index] = activeSources[index].filter(s => s !== source);
                };
            }
        }

        function scheduleNextCircleLoop(index, isFirstTime) {
            if (!isRunning) return;

            if (timers[index]) {
                clearTimeout(timers[index]);
            }

            let delay;
            
            if (isFirstTime) {
                delay = (index === 4) ? 1000 : Math.floor(Math.random() * 201 + 1100);
            } else {
                delay = (index === 4) ? 1000 : Math.floor(Math.random() * 901 + 300);
            }

            timers[index] = setTimeout(() => {
                executeCircleAction(index);
            }, delay);
        }

        function executeCircleAction(index) {
            if (!isRunning) return;

            const circle = circles[index];
            const state = circleStates[index];

            circle.style.display = 'block';
            circle.style.width = state.size + 'px';
            circle.style.height = state.size + 'px';

            playSound(index, state.level);

            state.size *= 1.5;
            state.level++;

            scheduleNextCircleLoop(index, false);
        }

        // 특정 원 하나만 콕 집어가 초기화하고 새 원 켜는 함수다
        function resetSingle(index) {
            if (timers[index]) clearTimeout(timers[index]);

            // 그 놈아 전용 소리통만 싹 다 뒤져서 소리 꺼삔다
            activeSources[index].forEach(source => {
                try { source.stop(); } catch(e) {}
            });
            activeSources[index] = [];

            // 크기랑 레벨 초기화하고 화면에서 일단 숨긴다
            circleStates[index] = { size: 8, level: 1 };
            circles[index].style.display = 'none';

            // 만약에 9개가 아직 다 안 켜졌으마 남은 자리 중에 하나 랜덤으로 뽑아가 켠데이
            if (activeIndices.length < 9) {
                let available = [];
                for (let i = 0; i < 9; i++) {
                    if (!activeIndices.includes(i)) available.push(i);
                }
                
                if (available.length > 0) {
                    let randIdx = available[Math.floor(Math.random() * available.length)];
                    activeIndices.push(randIdx);
                    scheduleNextCircleLoop(randIdx, true);
                }
            }

            // 초기화된 놈아도 처음 딜레이부터 다시 시작하구로 걸어준다
            scheduleNextCircleLoop(index, true);
        }

        function clearAllTimers() {
            timers.forEach(t => {
                if (t) clearTimeout(t);
            });
            timers.fill(null);
        }

        function hardReset() {
            clearAllTimers();
            
            isRunning = false;
            activeIndices = [4]; 
            circleStates = Array.from({length: 9}, () => ({ size: 8, level: 1 }));
            
            // 9개 소리통 싹 다 돌아가면서 끄는 기다
            activeSources.forEach(arr => {
                arr.forEach(source => { try { source.stop(); } catch(e) {} });
            });
            activeSources = Array.from({length: 9}, () => []);
            
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            
            circles.forEach(c => c.style.display = 'none');
            startScreen.style.display = 'block';
            
            document.getElementById('hide-today-checkbox').checked = false;
        }

        // 각각의 칸(셀)에다가 클릭 감지기를 달아놨다
        cells.forEach((cell, index) => {
            cell.addEventListener('click', (e) => {
                if (!isRunning) return;
                
                // 이거 안 적으마 밑에 있는 전체 화면 클릭까지 같이 반응해삐서 에러 난데이
                e.stopPropagation(); 
                
                // 이미 켜진 놈아를 눌렀을 때만 작동하게 막아놨다
                if (activeIndices.includes(index)) {
                    resetSingle(index);
                }
            });
        });

        // 이건 처음에 시작할 때만 반응하구로 역할이 확 쪼그라들었다
        document.body.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') {
                if (!isRunning) {
                    setTimeout(() => {
                        startApp();
                    }, 300);
                }
                return;
            }
            
            if (!isRunning) {
                startApp();
            }
            // 전체 초기화하던 코드는 없애삤다
        });
        
        function startApp() {
            if (isRunning) return;
            isRunning = true;
            startScreen.style.display = 'none';
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            audioArrayBuffers.forEach((buffer, i) => {
                if (buffer && !audioBuffers[i]) {
                    audioCtx.decodeAudioData(buffer.slice(0), (decoded) => {
                        audioBuffers[i] = decoded;
                    });
                }
            });

            activeIndices.forEach(index => {
                scheduleNextCircleLoop(index, true);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hardReset();
            }
        });
    </script>
</body>
</html>
