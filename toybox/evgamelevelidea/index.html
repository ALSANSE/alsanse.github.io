<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디어 룰렛</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f3f4f6;
    }

    /* 커스텀 체크박스 스타일 */
    .custom-checkbox:checked {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    .custom-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
  </style>
</head>

<body class="text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">

    <div class="bg-blue-600 p-6 text-white text-center">
      <h1 class="text-3xl font-bold">💡 아이디어 조합 룰렛</h1>
      <p class="mt-2 text-blue-100 opacity-80">원하는 항목을 조합하여 랜덤으로 아이디어를 생성해보세요.</p>
    </div>

    <div class="p-6 space-y-6">
      <!-- 상황 (~에서) -->
      <div
        class="category-row flex flex-col md:flex-row items-start md:items-center gap-4 p-4 rounded-xl border border-gray-100 bg-gray-50 transition-opacity duration-200"
        id="row-situation">
        <div class="flex items-center gap-3 md:w-1/4">
          <div class="relative w-5 h-5">
            <input type="checkbox" id="check-situation" checked
              class="custom-checkbox appearance-none w-5 h-5 border-2 border-gray-300 rounded cursor-pointer transition-colors relative z-10 bg-white">
          </div>
          <label for="check-situation" class="font-semibold text-lg cursor-pointer select-none text-gray-700">상황 <span
              class="text-sm font-normal text-gray-500">(~에서)</span></label>
        </div>
        <div
          class="flex-1 w-full bg-white px-4 py-3 border border-gray-200 rounded-lg min-h-[50px] flex items-center justify-center text-center shadow-sm">
          <span id="text-situation" class="text-gray-400 font-medium break-keep">랜덤 버튼을 눌러주세요</span>
        </div>
        <button onclick="rollCategory('situation')" id="btn-situation"
          class="w-full md:w-auto px-6 py-3 bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold rounded-lg shadow-sm transition-colors focus:ring-2 focus:ring-blue-400 focus:outline-none">
          랜덤
        </button>
      </div>

      <!-- 상호작용 (~을 해서) -->
      <div
        class="category-row flex flex-col md:flex-row items-start md:items-center gap-4 p-4 rounded-xl border border-gray-100 bg-gray-50 transition-opacity duration-200"
        id="row-interaction">
        <div class="flex items-center gap-3 md:w-1/4">
          <div class="relative w-5 h-5">
            <input type="checkbox" id="check-interaction" checked
              class="custom-checkbox appearance-none w-5 h-5 border-2 border-gray-300 rounded cursor-pointer transition-colors relative z-10 bg-white">
          </div>
          <label for="check-interaction" class="font-semibold text-lg cursor-pointer select-none text-gray-700">상호작용
            <span class="text-sm font-normal text-gray-500">(~해서)</span></label>
        </div>
        <div
          class="flex-1 w-full bg-white px-4 py-3 border border-gray-200 rounded-lg min-h-[50px] flex items-center justify-center text-center shadow-sm">
          <span id="text-interaction" class="text-gray-400 font-medium break-keep">랜덤 버튼을 눌러주세요</span>
        </div>
        <button onclick="rollCategory('interaction')" id="btn-interaction"
          class="w-full md:w-auto px-6 py-3 bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold rounded-lg shadow-sm transition-colors focus:ring-2 focus:ring-blue-400 focus:outline-none">
          랜덤
        </button>
      </div>

      <!-- 목적 (~하기) -->
      <div
        class="category-row flex flex-col md:flex-row items-start md:items-center gap-4 p-4 rounded-xl border border-gray-100 bg-gray-50 transition-opacity duration-200"
        id="row-purpose">
        <div class="flex items-center gap-3 md:w-1/4">
          <div class="relative w-5 h-5">
            <input type="checkbox" id="check-purpose" checked
              class="custom-checkbox appearance-none w-5 h-5 border-2 border-gray-300 rounded cursor-pointer transition-colors relative z-10 bg-white">
          </div>
          <label for="check-purpose" class="font-semibold text-lg cursor-pointer select-none text-gray-700">목적 <span
              class="text-sm font-normal text-gray-500">(~하기)</span></label>
        </div>
        <div
          class="flex-1 w-full bg-white px-4 py-3 border border-gray-200 rounded-lg min-h-[50px] flex items-center justify-center text-center shadow-sm">
          <span id="text-purpose" class="text-gray-400 font-medium break-keep">랜덤 버튼을 눌러주세요</span>
        </div>
        <button onclick="rollCategory('purpose')" id="btn-purpose"
          class="w-full md:w-auto px-6 py-3 bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold rounded-lg shadow-sm transition-colors focus:ring-2 focus:ring-blue-400 focus:outline-none">
          랜덤
        </button>
      </div>
    </div>

    <div class="p-6 bg-gray-50 border-t border-gray-200 space-y-4">
      <h2 class="text-xl font-bold text-gray-700 text-center mb-2">최종 결과 문장</h2>
      <div id="final-result-container"
        class="w-full min-h-[80px] bg-white border-2 border-blue-200 rounded-xl flex items-center justify-center p-4 shadow-inner transition-colors duration-300">
        <span id="final-result-text"
          class="text-lg md:text-xl font-bold text-blue-600 text-center break-keep leading-relaxed">
          항목을 선택하여 문장을 완성하세요.
        </span>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-4">
        <button onclick="rollAll()"
          class="flex-1 py-4 bg-gray-800 hover:bg-gray-900 text-white text-lg font-bold rounded-xl shadow-md transition-transform transform active:scale-[0.98] focus:outline-none">
          🎲 활성화된 항목 전체 랜덤
        </button>
        <button onclick="copyToClipboard()" id="btn-copy"
          class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-xl shadow-md transition-transform transform active:scale-[0.98] focus:outline-none flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          결과 복사하기
        </button>
      </div>
    </div>
  </div>

  <script>
    // 제공된 데이터셋
    const database = {
      situation: [
        "무중력 공간에서", "미끄러지는 바닥에서", "끈적한 바닥에서", "몸을 이끄는 공간에서",
        "물리적으로 관통되는 요소가 있는 공간에서", "아주 넓은 공간에서", "아주 협소한 공간에서",
        "절대적인 스케일이 거대한 공간에서", "가시거리가 짧은 상황에서", "투명한 벽과 바닥이 있는 공간에서"
      ],
      interaction: [
        "사물을 가져다 놓아서", "사물을 가져와서", "사물을 이동시켜서", "정보를 기록해서", "정보를 기입해서",
        "버튼을 한 번 눌러서", "버튼을 계속 눌러서", "버튼을 정확히 눌러서", "걸으면서", "달리면서",
        "점프하면서", "가만히 있으면서", "바라보거나 보지 않으면서", "플래시, UV라이트를 쓰면서", "투척 및 사격하면서",
        "청소도구를 쓰면서", "소화기를 쓰면서", "카메라로 촬영하면서", "카트를 쓰면서"
      ],
      purpose: [
        "시간 내에 빠르게 하기", "시간 동안 하기", "정확한 시간 맞추기", "찾아내기", "피하기",
        "(멀리/가까이/정확히) 도달하기", "수량만큼 (넘기기/넘기지 않기/딱 맞추기)",
        "횟수만큼 (넘기기/넘기지 않기/딱 맞추기)", "속도만큼 (넘기기/넘기지 않기/딱 맞추기)",
        "무게만큼 (넘기기/넘기지 않기/딱 맞추기)", "체력만큼 (넘기기/넘기지 않기/딱 맞추기)"
      ]
    };

    // 현재 선택된 상태 저장
    const currentState = {
      situation: "",
      interaction: "",
      purpose: ""
    };

    // DOM 요소 캐싱
    const categories = ['situation', 'interaction', 'purpose'];

    document.addEventListener('DOMContentLoaded', () => {
      // 체크박스 이벤트 바인딩
      categories.forEach(cat => {
        const checkbox = document.getElementById(`check-${cat}`);
        checkbox.addEventListener('change', (e) => {
          toggleCategory(cat, e.target.checked);
          updateFinalResult();
        });
      });

      // 초기 문장 생성
      rollAll();
    });

    // 카테고리 활성/비활성 처리
    function toggleCategory(category, isEnabled) {
      const row = document.getElementById(`row-${category}`);
      const btn = document.getElementById(`btn-${category}`);
      const textEl = document.getElementById(`text-${category}`);

      if (isEnabled) {
        row.classList.remove('opacity-50');
        btn.disabled = false;
        btn.classList.remove('cursor-not-allowed', 'bg-gray-200', 'text-gray-400');
        btn.classList.add('bg-blue-100', 'hover:bg-blue-200', 'text-blue-700');
        textEl.classList.remove('text-gray-300');
        if (currentState[category]) {
          textEl.classList.add('text-gray-800');
        }
      } else {
        row.classList.add('opacity-50');
        btn.disabled = true;
        btn.classList.remove('bg-blue-100', 'hover:bg-blue-200', 'text-blue-700');
        btn.classList.add('cursor-not-allowed', 'bg-gray-200', 'text-gray-400');
        textEl.classList.add('text-gray-300');
        textEl.classList.remove('text-gray-800');
      }
    }

    // 단일 카테고리 랜덤 돌리기
    function rollCategory(category) {
      const items = database[category];
      const randomIndex = Math.floor(Math.random() * items.length);
      const selectedText = items[randomIndex];

      currentState[category] = selectedText;

      const textEl = document.getElementById(`text-${category}`);
      textEl.textContent = selectedText;
      textEl.classList.remove('text-gray-400');
      textEl.classList.add('text-gray-800');

      updateFinalResult();
    }

    // 전체(활성화된 항목만) 랜덤 돌리기
    function rollAll() {
      categories.forEach(cat => {
        const isEnabled = document.getElementById(`check-${cat}`).checked;
        if (isEnabled) {
          rollCategory(cat);
        }
      });
    }

    // 최종 결과 문장 업데이트
    function updateFinalResult() {
      const finalResultEl = document.getElementById('final-result-text');
      const resultParts = [];

      categories.forEach(cat => {
        const isEnabled = document.getElementById(`check-${cat}`).checked;
        if (isEnabled && currentState[cat]) {
          resultParts.push(currentState[cat]);
        }
      });

      if (resultParts.length > 0) {
        finalResultEl.textContent = resultParts.join(' ');
        finalResultEl.classList.remove('text-gray-400');
        finalResultEl.classList.add('text-blue-600');
      } else {
        finalResultEl.textContent = "모든 항목이 비활성화 되었습니다.";
        finalResultEl.classList.remove('text-blue-600');
        finalResultEl.classList.add('text-gray-400');
      }
    }

    function copyToClipboard() {
      const textToCopy = document.getElementById('final-result-text').textContent.trim();
      const copyBtn = document.getElementById('btn-copy');

      if (!textToCopy || textToCopy === "모든 항목이 비활성화 되었습니다." || textToCopy === "항목을 선택하여 문장을 완성하세요.") {
        alert("복사할 결과가 없습니다.");
        return;
      }

      // Clipboard API (최신 브라우저 지원) 또는 execCommand 대체재 사용
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showCopySuccess(copyBtn);
        });
      } else {
        // iframe 등에서 보안 컨텍스트 문제 해결을 위한 임시 textarea 생성 방식
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showCopySuccess(copyBtn);
        } catch (err) {
          console.error('복사 실패', err);
          alert("복사에 실패했습니다. 직접 드래그해서 복사해주세요.");
        }
        textArea.remove();
      }
    }

    // 복사 성공 시 버튼 UI 피드백
    function showCopySuccess(btn) {
      const originalContent = btn.innerHTML;
      const originalBg = btn.className;

      btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                복사 완료!
            `;
      btn.className = "flex-1 py-4 bg-green-500 text-white text-lg font-bold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 cursor-default";

      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.className = originalBg;
      }, 2000);
    }
  </script>
</body>

</html>
