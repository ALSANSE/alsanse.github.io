<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘 하루동안 보지 않기</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #start-screen {
            position: absolute;
            z-index: 100;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 90vw;
            max-width: calc(90vh * (4 / 6));
            aspect-ratio: 4 / 6;
            padding: 20px;
        }

        .grid-cell {
            position: relative; 
        }

        .circle {
            width: 13px;
            height: 13px;
            background-color: #ff3333;
            border-radius: 50%;
            position: absolute;
            left: 90%;
            top: 10%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 10; 
            cursor: pointer;
            box-shadow: 0px 0px 21px rgba(128,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <label class="checkbox-label">
            <input type="checkbox" id="hide-today-checkbox">
            오늘 하루동안 보지 않기
        </label>
    </div>
    
    <div id="grid-container">
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
        <div class="grid-cell"><div class="circle"></div></div>
    </div>

    <script>
        const SPECIAL_SOUND_FILE = './notisounds/50-1.mp3';

        const AUDIO_FILES = [
            './notisounds/instagram02.wav', 
            './notisounds/galaxy02.wav',    
            './notisounds/kakaotalk.wav',   
            './notisounds/galaxy01.mp3',    
            './notisounds/iphone2.mp3',     
            './notisounds/iphone01.wav',    
            './notisounds/discord.mp3',     
            './notisounds/instagram01.wav', 
            './notisounds/facebook.mp3',    
            
            './notisounds/instagram02.wav', 
            './notisounds/galaxy02.wav',    
            './notisounds/kakaotalk.wav',   
            './notisounds/galaxy01.mp3',    
            './notisounds/iphone2.mp3',     
            './notisounds/iphone01.wav',    
            './notisounds/discord.mp3',     
            './notisounds/instagram01.wav', 
            './notisounds/facebook.mp3',    
            './notisounds/instagram02.wav', 
            './notisounds/galaxy02.wav',    
            './notisounds/kakaotalk.wav',   
            './notisounds/galaxy01.mp3',    
            './notisounds/iphone2.mp3',     
            './notisounds/iphone01.wav'     
        ];

        const TOTAL_ITEMS = AUDIO_FILES.length;

        let audioCtx;
        let audioBuffers = new Array(TOTAL_ITEMS).fill(null);
        
        // 최적화 1: 중복된 주소는 빼고 딱 필요한 파일만 한 번씩 받구로 Set을 썼데이
        const uniqueUrls = [...new Set(AUDIO_FILES)];
        let urlToArrayBuffer = {};
        
        let specialAudioArrayBuffer = null;
        let specialAudioBuffer = null;
        let specialSource = null;
        let specialGainNode = null;
        let isSpecialPlaying = false;
        
        let isRunning = false;
        
        let activeSources = Array.from({length: TOTAL_ITEMS}, () => []); 
        
        let initialIndex = Math.floor(Math.random() * TOTAL_ITEMS);
        let activeIndices = [initialIndex]; 

        let circleStates = Array.from({length: TOTAL_ITEMS}, () => ({ size: 13, level: 1 }));
        
        let timers = new Array(TOTAL_ITEMS).fill(null);

        const circles = document.querySelectorAll('.circle');
        const cells = document.querySelectorAll('.grid-cell');
        const startScreen = document.getElementById('start-screen');
        const gridContainer = document.getElementById('grid-container');
        const hideCheckbox = document.getElementById('hide-today-checkbox');

        // 특수 사운드 땡겨오는 부분이다
        fetch(SPECIAL_SOUND_FILE)
            .then(response => response.arrayBuffer())
            .then(buffer => {
                specialAudioArrayBuffer = buffer;
                if (audioCtx && !specialAudioBuffer) {
                    audioCtx.decodeAudioData(buffer.slice(0), (decoded) => {
                        specialAudioBuffer = decoded;
                        setupSpecialSound();
                    });
                }
            })
            .catch(err => console.log("특수 소리 파일 경로 확인해 봐라."));

        // 최적화된 다운로드 방식이다, 이제 똑같은 파일은 여러 번 안 받는데이
        uniqueUrls.forEach(url => {
            fetch(url)
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    urlToArrayBuffer[url] = buffer;
                    if (audioCtx) {
                        AUDIO_FILES.forEach((path, i) => {
                            if (path === url && !audioBuffers[i]) {
                                audioCtx.decodeAudioData(buffer.slice(0), (decoded) => {
                                    audioBuffers[i] = decoded;
                                });
                            }
                        });
                    }
                })
                .catch(err => {
                    console.log("파일 경로 확인해 봐라: " + url);
                });
        });

        // HTML 태그에다가 몇 번째 칸인지 인덱스 번호를 이름표처럼 달아놨데이
        cells.forEach((cell, index) => {
            cell.dataset.index = index;
        });

        function setupSpecialSound() {
            if (!audioCtx || !specialAudioBuffer || specialSource) return;
            
            specialSource = audioCtx.createBufferSource();
            specialSource.buffer = specialAudioBuffer;
            specialSource.loop = true; 

            specialGainNode = audioCtx.createGain();
            specialGainNode.gain.setValueAtTime(0, audioCtx.currentTime); 

            specialSource.connect(specialGainNode);
            specialGainNode.connect(audioCtx.destination);

            specialSource.start(0);
        }

        function updateSpecialSoundState() {
            if (!specialGainNode || !audioCtx) return;
            
            let visibleCount = Array.from(circles).filter(c => c.style.display === 'block').length;
            
            if (visibleCount >= 6) {
                let targetVolume = visibleCount / 6;

                specialGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                specialGainNode.gain.setValueAtTime(specialGainNode.gain.value, audioCtx.currentTime);
                
                specialGainNode.gain.linearRampToValueAtTime(targetVolume, audioCtx.currentTime + 0.5);
                isSpecialPlaying = true;
            } else {
                if (isSpecialPlaying) {
                    specialGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                    specialGainNode.gain.setValueAtTime(specialGainNode.gain.value, audioCtx.currentTime);
                    specialGainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                    isSpecialPlaying = false;
                }
            }
        }

        function playSound(index, currentLevel) {
            if (!audioCtx) return;
            const buffer = audioBuffers[index];
            if (!buffer) return;

            for (let i = 0; i < currentLevel; i++) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;

                const gainNode = audioCtx.createGain();
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                source.start(0);
                
                activeSources[index].push(source);

                source.onended = () => {
                    activeSources[index] = activeSources[index].filter(s => s !== source);
                };
            }
        }

        function scheduleNextCircleLoop(index, isFirstTime) {
            if (!isRunning) return;

            if (timers[index]) {
                clearTimeout(timers[index]);
            }

            let delay;
            
            if (isFirstTime) {
                delay = (index === initialIndex) ? 1000 : Math.floor(Math.random() * 1101 + 1300);
            } else {
                delay = (index === initialIndex) ? 1000 : Math.floor(Math.random() * 1201 + 600);
            }

            timers[index] = setTimeout(() => {
                executeCircleAction(index);
            }, delay);
        }

        function executeCircleAction(index) {
            if (!isRunning) return;

            const circle = circles[index];
            const state = circleStates[index];

            circle.style.display = 'block';
            circle.style.width = state.size + 'px';
            circle.style.height = state.size + 'px';

            playSound(index, state.level);

            state.size *= 1.618;
            state.level++;

            updateSpecialSoundState();

            scheduleNextCircleLoop(index, false);
        }

        function resetSingle(index) {
            if (timers[index]) clearTimeout(timers[index]);

            activeSources[index].forEach(source => {
                try { source.stop(); } catch(e) {}
            });
            activeSources[index] = [];

            circleStates[index] = { size: 13, level: 1 };
            circles[index].style.display = 'none';
            
            updateSpecialSoundState();

            if (activeIndices.length < TOTAL_ITEMS) {
                let available = [];
                for (let i = 0; i < TOTAL_ITEMS; i++) {
                    if (!activeIndices.includes(i)) available.push(i);
                }
                
                if (available.length > 0) {
                    let randIdx = available[Math.floor(Math.random() * available.length)];
                    activeIndices.push(randIdx);
                    scheduleNextCircleLoop(randIdx, true);
                }
            }

            scheduleNextCircleLoop(index, true);
        }

        function clearAllTimers() {
            timers.forEach(t => {
                if (t) clearTimeout(t);
            });
            timers.fill(null);
        }

        function hardReset() {
            clearAllTimers();
            
            isRunning = false;
            
            initialIndex = Math.floor(Math.random() * TOTAL_ITEMS);
            activeIndices = [initialIndex]; 
            
            circleStates = Array.from({length: TOTAL_ITEMS}, () => ({ size: 13, level: 1 }));
            
            activeSources.forEach(arr => {
                arr.forEach(source => { try { source.stop(); } catch(e) {} });
            });
            activeSources = Array.from({length: TOTAL_ITEMS}, () => []);
            
            if (specialSource) {
                try { specialSource.stop(); } catch(e) {}
                specialSource = null;
                specialGainNode = null;
                isSpecialPlaying = false;
            }
            
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            
            circles.forEach(c => c.style.display = 'none');
            startScreen.style.display = 'block';
            
            hideCheckbox.checked = false;
        }

        // 최적화 2: 48개씩 달리던 이벤트 감지기를 바깥 판때기에 하나만 딱 달았데이
        gridContainer.addEventListener('pointerdown', (e) => {
            if (!isRunning) return;
            
            const cell = e.target.closest('.grid-cell');
            if (cell) {
                e.stopPropagation(); 
                const index = parseInt(cell.dataset.index, 10);
                if (activeIndices.includes(index)) {
                    resetSingle(index);
                }
            }
        });

        // 엉뚱한 데 눌러도 켜지는 버그 잡으려고 체크박스 상태 변할 때만 시작하게 바꿨데이
        hideCheckbox.addEventListener('change', () => {
            if (!isRunning) {
                setTimeout(() => {
                    startApp();
                }, 300);
            }
        });
        
        function startApp() {
            if (isRunning) return;
            isRunning = true;
            startScreen.style.display = 'none';
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            if (specialAudioArrayBuffer && !specialAudioBuffer) {
                audioCtx.decodeAudioData(specialAudioArrayBuffer.slice(0), (decoded) => {
                    specialAudioBuffer = decoded;
                    setupSpecialSound();
                });
            } else if (specialAudioBuffer) {
                setupSpecialSound();
            }
            
            // 캐시해둔 오디오 파일들을 다 풀어주는 기다
            AUDIO_FILES.forEach((url, i) => {
                const buffer = urlToArrayBuffer[url];
                if (buffer && !audioBuffers[i]) {
                    audioCtx.decodeAudioData(buffer.slice(0), (decoded) => {
                        audioBuffers[i] = decoded;
                    });
                }
            });

            activeIndices.forEach(index => {
                scheduleNextCircleLoop(index, true);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hardReset();
            }
        });
    </script>
</body>
</html>
