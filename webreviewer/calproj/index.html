        .months {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: calc(100vw - 26px - 26px);
            padding: 21px 13px;
            margin: 13px;
            gap: 13px;
            border-radius: 21px;
            background-color: #ffffff;
            box-shadow: 0px 8px 34px rgba(0, 0, 33, 0.1);
        }

        .images {
            position: relative;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 3px;
            width: calc(100vw - 26px - 26px);
        }

        .monthImages {
            width: calc(50% - 3px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 3px;
            background-color: #f1f3f9;
        }
